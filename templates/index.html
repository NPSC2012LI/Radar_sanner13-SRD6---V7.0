<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadarRangingLZ</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html {
            height: 100%;
            background-color: #000000;
            font-size: 10px;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100vh; /* 希望的任何高度 */
            overflow: hidden; /* 防止内容溢出 */
        }
        /* 设置渐变栅格图形 */
        body {
            background-image: linear-gradient(0deg, transparent 24%, rgba(32, 255, 77, 0.1) 25%, rgba(32, 255, 77, 0.1) 26%, transparent 27%, transparent 74%, rgba(32, 255, 77, 0.1) 75%, rgba(32, 255, 77, 0.1) 76%, transparent 77%, transparent),
                              linear-gradient(90deg, transparent 24%, rgba(32, 255, 77, 0.1) 25%, rgba(32, 255, 77, 0.1) 26%, transparent 27%, transparent 74%, rgba(32, 255, 77, 0.1) 75%, rgba(32, 255, 77, 0.1) 76%, transparent 77%, transparent);
            background-size: 7rem 7rem;

            background-position: -5.2rem -5.2rem;
            width: 100%;
            height: 100%;
            position: relative;
            padding: 0;
            margin: 0;
            font-size: 1.6rem;
        }
        /* 定义扫描动画关键帧 */
        @keyframes scanning-animation {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-360deg);/* -为逆时针扫描 */
            }
        }
        /* 雷达环形图形渐变实现 */
        .lizhi {
            background: -webkit-radial-gradient(center, rgba(32, 255, 77, 0.4) 0%, rgba(32, 255, 77, 0) 60%),
                        -webkit-repeating-radial-gradient(rgba(32, 255, 77, 0) 5.8%, rgba(32, 255, 77, 0) 18%, #20ff4d 18.8%, rgba(32, 255, 77, 0) 18.9%),
                        -webkit-linear-gradient(90deg, rgba(32, 255, 77, 0) 49.5%, #20ff4d 50%, #20ff4d 50%, rgba(32, 255, 77, 0) 50%),
                        -webkit-linear-gradient(0deg, rgba(32, 255, 77, 0) 49.5%, #20ff4d 50%, #20ff4d 50%, rgba(32, 255, 77, 0) 50%);
            width: 75vw;
            height: 75vw;
            max-height: 75vh;
            max-width: 75vh;
            position: relative;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;/* 将元素变成圆形 */
            border: 0.35rem solid #0cdd36; /* 为元素添加了一个边框 */
            overflow: hidden;
        }
        /* 水波纹动画元素 */
        .lizhi:before {
            content: ' ';
            /* display: block; */
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            animation: bei 6s linear infinite;
            animation-timing-function: linear;
            animation-delay: 1.4s;
        }
        /* 扫描动画参数 */
        .lizhi:after {
            content: ' ';
            display: block;
            background-image: linear-gradient(to bottom left, rgba(0, 255, 51, 0) 50%, #00bb22 100%); /* 顺时针：44deg */
            width: 50%;
            height: 50%;
            position: absolute;
            top: 0;
            left: 0;
            animation: zhuan 0.5s linear infinite;
            animation: scanning-animation 6s linear infinite; /* 扫描线周期T */
            animation-timing-function: linear;
            transform-origin: bottom right;
            border-radius: 100% 0 0 0;
        }
        .lizhi[paused="true"]:after {
            animation-play-state: paused;
        }
        @keyframes zhuan {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes bei {
            14% {
                background: radial-gradient(2vmin circle at 75% 70%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%);
            }
            14.0002% {
                background: radial-gradient(2vmin circle at 75% 70%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%), radial-gradient(2vmin circle at 63% 72%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%);
            }
            25% {
                background: radial-gradient(2vmin circle at 75% 70%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%), radial-gradient(2vmin circle at 63% 72%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%), radial-gradient(2vmin circle at 56% 86%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%);
            }
            26% {
                background: radial-gradient(2vmin circle at 75% 70%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%), radial-gradient(2vmin circle at 63% 72%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%), radial-gradient(2vmin circle at 56% 86%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%);
                opacity: 1;
            }
            100% {
                background: radial-gradient(2vmin circle at 75% 70%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%), radial-gradient(2vmin circle at 63% 72%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%), radial-gradient(2vmin circle at 56% 86%, #ffffff 10%, #20ff4d 30%, rgba(255, 255, 255, 0) 100%);
                opacity: 0;
            }
        }
        @keyframes rippleAnimation {
            from {
                transform: scale(0);
                opacity: 1;
            }
            to {
                transform: scale(1);
                opacity: 0;
            }
        }
        .ripple {
            animation: rippleAnimation 2s infinite;
        }
        /* 动画启停按钮设置 */
        .button-container {
            position: absolute;
            bottom: 100px;
            left: 90%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
        }
        button {
            padding: 10px 35px; /* 减少内边距 */
            font-size: 18px; /* 减小字体大小 */
            color: white;
            background-color: #0000FF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.3s;
            white-space: nowrap !important; /* 强制防止文本换行 */
            min-width: 80px; /* 设置最小宽度 */
            box-sizing: border-box; /* 包含内边距和边框在内的总宽度计算方式 */
        }
        button:hover {
            background-color: #45a049;
        }
        /* 隐藏 resumeBtn */
        #resumeBtn {
            display: none;
        }
        .coordinate-label {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            font-size: 1.4rem;
            z-index: 2;
        }


        /* 实时扫描数据标签设置 */
        .info-container {
            background-color: #0c4623;
            height: 45px;
            width: 100%;
            position: fixed;
            bottom: 0;
            display: flex;
            justify-content: space-between; /* 调整子元素间的间距 */
            align-items: center; /* 垂直居中对齐 */
            padding: 0 15px; /* 增加内边距以提升布局美观 */
            color: #fff; /* 设置文本颜色为白色 */
        }
        .info-container span {
            display: inline-block;
            font-size: 20px;
            margin-left: 5px; /* 为数据值增加左侧间距 */
        }
        #temperatureContainer {
            display: none;
        }

        /* 圆形容器的样式 */
        .circle-container {
            position: absolute;
            width: 75vmin; /* 使用 vmin 来保持响应式，并且与 .lizhi 的尺寸相匹配（大约） */
            height: 75vmin;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.05); /* 半透明背景以便更好地看到文本 */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); /* 使 .circle-container 居中 */
        }

        /* 分割线的样式 */
        .division-line {
            position: absolute;
            width: 52%;
            height: 2px;
            background-color: green;
            top: 50%;
            left: 50%;
            transform-origin: left center;
        }

        /* 标注的样式 */
        .label {
            position: absolute;
            width: auto; /* 宽度增加以适应“0°/360°”文本 */
            padding: 5px; /* 添加内边距以增加可读性 */
            font-size: 22px; /* 设置字体大小 */
            text-align: center;
            color: rgb(181, 243, 10);
            background-color: rgba(255, 0, 0, 0);
            border-radius: 5px;
        }
        /* 新增下拉菜单样式 */
        .temperature-select {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 5px 30px;
            font-size: 2.0rem;
            color: white;
            background-color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.3s;
        }
        #temperatureSelect {
            display: none;
        }
        /* 控制电机按钮样式 */
        .motor-control {  /* 重置继承的样式 */
            all: unset;
        }
        /* 自定义样式 */
        .motor-control {
            position: fixed;
            bottom: 100px;
            left: 30px;
            display: flex;
            /* flex-direction: column; */
            flex-direction: row; /* 修改为行内排列 */
            gap: 30px;
            background-color: #ffffff00; /* 自定义背景颜色 */
            padding: 10px; /* 添加内边距 */
            border-radius: 5px; /* 边框圆角 */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* 添加阴影 */
        }
        .motor-control button {
            padding: 10px 35px;
            font-size: 20px;
            color: white;
            background-color: #0000FF;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: background-color 0.3s;
        }
        .motor-control button:hover {
            background-color: #45a049;
        }
        /** 动态表格样式 **/
        .sensor-data-table-container {
            width: 100%; /* 容器宽度 */
            max-width: 20vw; /* 容器最大宽度 */
            margin: 10px 0 0 0; /* 上边距设置为10px，左边距为0 */
            padding: 0; /* 无内边距 */
            overflow-x: auto; /* 超出宽度时水平滚动 */
            position: absolute; /* 绝对定位 */
            top: 20px; /* 距离页面顶部20px */
            left: 20px; /* 距离页面左边20px */
        }

        /* 表格样式 */
        .sensor-data-table {
            width: 100%; /* 表格宽度 */
            border-collapse: collapse; /* 合并边框 */
            table-layout: fixed; /* 固定表格布局 */
        }

        /* 表格头部样式 */
        .sensor-data-table th {
            background-color: #4CAF50; /* 背景颜色 */
            color: white; /* 文本颜色 */
            padding: 3px; /* 内边距 */
            text-align: center; /* 文本左对齐 */
            font-weight: bold; /* 字体加粗 */
            border: 1px solid #37784c; /* 头部边框样式 */
            box-sizing: border-box; /* 包括内边距和边框在内的宽度/高度 */
        }

        /* 表格单元格样式 */
        .sensor-data-table td {
            border: 1px solid #ddd; /* 单元格边框 */
            padding: 3px; /* 内边距 */
            text-align: center; /* 文本居中对齐 */
            color: white; /* 设置统一的文本颜色 */
            box-sizing: border-box; /* 包括内边距和边框在内的宽度/高度 */
        }

        /* 表格行的hover样式 */
        .sensor-data-table tr:hover {
            background-color: #1b0ddd; /* 鼠标悬停时的背景颜色 */
        }

        /* 表格行高 */
        .sensor-data-table tr {
            height: 16px; /* 行高 */
        }

        /* 表格列宽 */
        .sensor-data-table th:first-child,
        .sensor-data-table td:first-child {
            width: 3vw; /* 序号列宽 */
        }

        .sensor-data-table th:first-child(2),
        .sensor-data-table td:first-child(2) {
            width: 6vw; /* 编号列宽 */
        }

        .sensor-data-table th:nth-child(3),
        .sensor-data-table td:nth-child(3) {
            width: 6vw; /* 距离列宽 */
        }

        .sensor-data-table th:nth-child(4),
        .sensor-data-table td:nth-child(4) {
            width: 6vw; /* 角度列宽 */
        }

        /* 表格边框样式 */
        .sensor-data-table {
            border: 2px solid #4CAF50; /* 整个表格的边框 */
        }

        .sensor-data-table th,
        .sensor-data-table td {
            border: 1px solid #37784c; /* 单元格边框 */
        }

        /* 形状容器样式 */
        .animation-container {
            position: fixed; /* 固定位置 */
            aspect-ratio: 1 / 1; /* 确保容器是正方形 */
            max-width: 80vw; /* 最大宽度限制 */
            width: min(80vw, 80vh); /* 宽度为视口宽度和高度的较小值的一半 */
            top: 50%; /* 将容器顶部定位在视口垂直中心 */
            left: 50%; /* 将容器左侧定位在视口水平中心 */
            transform: translate(-50%, -50%); /* 向左和向上移动自身宽度和高度的一半以居中 */
            background-color: rgba(44, 62, 80, 0.2); /* 设置透明度 */
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            place-items: center;
        }

        /* 圆点样式 */
        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: rgba(28, 79, 19, 0); /* 设置透明度 */
        }

        /* 提示消息样式 */
        #system-message {
            display: block;
            position: fixed; /* 固定位置 */
            top: 1px; /* 距离顶部 20px */
            left: 50%; /* 水平居中 */
            transform: translateX(-50%); /* 向左移动自身宽度的 50% 以居中 */
            background-color: #17181700; /* 背景颜色 */
            color: white; /* 字体颜色 */
            font-size: 16px; /* 字体大小 */
            padding: 15px 100px; /* 内边距 */
            border-radius: 10px; /* 圆角 */
            z-index: 1000; /* 确保在顶层 */
            opacity: 1; /* 确保完全可见 */
            transition: opacity 0.5s; /* 添加透明度变化效果，便于观察 */
        }

        /* 系统说明样式 */
        #system-description {
            display: block;
            position: fixed; /* 固定位置 */
            bottom: 180px;
            right: 5px;
            background-color: #17181739; /* 背景颜色 */
            color: white; /* 字体颜色 */
            font-size: 16px; /* 字体大小 */
            padding: 2px; /* 内边距 */
            border-radius: 10px; /* 圆角 */
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.5s;
            white-space: pre-line;
            width: calc(100% - 10px); /* 宽度为视窗宽度减去左右边距 */
            max-width: 460px; /* 设置最大宽度 */
            height: auto; /* 高度根据内容自适应 */
            overflow-y: auto; /* 如果内容超出容器高度则允许滚动 */
            line-height: 1.2;
            margin-top: 0;
            margin-bottom: 2px;
        }

        /* 系统说明文本样式 */
        .bold-italic-red {
            font-weight: bold;
            /* font-style: italic; */
            color: #ffff00; /* 设置字体颜色为黄色 */
            display: block; /* 将 span 转换为块级元素 */
            margin-top: 0; /* 移除顶部外边距 */
            margin-bottom: 1px; /* 控制与下文的距离 */
            font-size: 18px; /* 设置字体大小 */
            line-height: 1.2; /* 设置行距 */
            font-family: "Arial", sans-serif; /* 设置字体类型 */
        }

        /* 调整段落样式 */
        #system-description p {
            margin-top: 0; /* 移除顶部外边距 */
            margin-bottom: 2px; /* 设置底部外边距 */
            line-height: 1.2; /* 设置行距 */
        }

    </style>
</head>
<body>

    <div class="lizhi"></div>
    <!-- 圆形容器-辅助分割线 -->
    <div id="circle-container" class="circle-container"></div>
    <!-- 显示雷达扫描实时数据 -->
    <div class="info-container">
        <!-- 使用<span>代替<p>进行内联布局（推荐方法） -->
        <span>  <span id="radarscan">相控阵雷达演示仪</span></span>
        <span>距离: <span id="distance">cm</span></span>
        <span>角度: <span id="angle">°</span></span>
        <span id="temperatureContainer">温度: <span id="temperature">℃</span></span>
    </div>
    <!-- 显示控制雷达扫描启停 -->
    <div class="button-container">
        <button id="pauseBtn">暂停</button>
        <button id="resumeBtn">Resume</button>
        <button id="refreshBtn">刷新</button>
    </div>
    <!-- 新增温度下拉菜单 -->
    <select id="temperatureSelect" class="temperature-select">
        <option value="">Default</option>
        <option value="0">0°C</option>
        <option value="20">20°C</option>
        <option value="40">40°C</option>
    </select>
    <!-- 控制motor启停 -->
   <div class="motor-control">
       <button id="startmotor">正转</button>
       <button id="inversion">反转</button>
       <button id="reset">复位</button>
    </div>
    <!-- 传感器数据表格 -->
    <div class="sensor-data-table-container">
        <table id="sensorDataTable" class="sensor-data-table">
            <thead>
                <tr>
                    <th>序号</th>
                    <th>编号</th>
                    <th>距离 (cm)</th>
                    <th>角度 (°)</th>
                </tr>
            </thead>
            <tbody>
                <!-- 数据行将通过JavaScript动态插入 -->
            </tbody>
        </table>
    </div>
    <!-- 动画容器 -->
    <div class="animation-container"></div>
    <!-- 追踪容器 -->
    <div id="system-message" class="hidden"></div>
    <!-- 系统备注 -->
    <div id="system-description" class="description">
        <span class="bold-italic-red">
            🔣相操作说明：
        </span>
        <p>
            1、最佳测试距离为2cm-10cm，数据刷新周期18s；<br>
            2、扫描视窗中黄色圆点图案即为前方物体的近似形状；<br>
            3、正、反转按钮每点击一次偏转7.5°。
        </p>
    <!-- 引用JavaScript文件 -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
